name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Unit / static / privacy suites. Electron E2E is intentionally NOT run here:
  # it launches a real Electron window, which does not open on the headless
  # GitHub Windows runner (firstWindow times out). E2E is a LOCAL release gate
  # (`npm run test:electron`, 59 passing on a workstation) — see README.
  test:
    name: Unit + static suites (Windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: All test:* suites except Electron E2E
        run: npm test -- --exclude test:electron
